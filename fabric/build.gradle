plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base {
    archivesName = "HoldToAttack"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    compileOnly project(":common")

    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
}

tasks.named('compileJava', JavaCompile).configure {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named('jar', Jar).configure {
    archiveFileName = "HoldToAttack-${rootProject.mod_version}-${project.name}-${rootProject.minecraft_version}.jar"
}

processResources {
    from(project(":common").sourceSets.main.resources)
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
        expand "version": project.version
    }
}
