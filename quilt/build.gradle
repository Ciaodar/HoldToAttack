plugins {
    id 'dev.architectury.loom' version '1.7-SNAPSHOT'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    
    // We don't even need mappings specified because Fabric Loom handles 26.2 automatically
    
    implementation project(":common")
    implementation project(":fabric")
}

processResources {
    inputs.property "version", project.version

    filesMatching("quilt.mod.json") {
        expand "version": project.version
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "HoldToAttack-${rootProject.mod_version}-quilt-${rootProject.minecraft_version}.jar"
    from project(":common").sourceSets.main.output
    from project(":fabric").sourceSets.main.output
}

tasks.named('remapJar').configure {
    archiveFileName = "HoldToAttack-${rootProject.mod_version}-quilt-${rootProject.minecraft_version}.jar"
}
